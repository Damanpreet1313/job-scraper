services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/jobscraper
      - REDIS_URL=redis://redis:6379/0
      - MATCH_THRESHOLD=0.15
      - MATCH_RETENTION_DAYS=3
      # Optional: set these to enable Groq LLM matching and scrape trigger
      # - GROQ_API_KEY=
      # - GROQ_MODEL=llama-3.1-70b-versatile
      # - SCRAPE_API_KEY=your-random-api-key-here
      # - ADZUNA_APP_ID=
      # - ADZUNA_APP_KEY=
      # - ADZUNA_REGION=in
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./resume.txt:/app/resume.txt:ro

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jobscraper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobscraper"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: